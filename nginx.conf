server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El backend no tiene prefijo /api: la barra final en proxy_pass lo quita
    # (/api/auth/login -> ${BACKEND_URL}/auth/login).
    # BACKEND_URL se reemplaza al iniciar el contenedor (ver Dockerfile).
    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
